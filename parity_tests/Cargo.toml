# 独立 workspace 根：不参与上级 workspace（根 Cargo.toml 已 exclude）
[workspace]

[package]
name = "parity_tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "开发专用 crate：新旧 Sparc 实现的差分对拍与性能对比基准（不发布）"

[dependencies]
sparc = { path = "../sparc" }
sparc-legacy = { package = "sparc", path = "../../Sparc" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parity"
harness = false

# 与根 workspace 对齐，保证基准/剖析构建的优化配置一致
[profile.release]
lto = "thin"
codegen-units = 1
